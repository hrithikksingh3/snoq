services:
  - type: web
    name: resource-vault-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: FRONTEND_URL
        value: https://snoq.onrender.com
      - key: COOKIE_SECURE
        value: "true"
  - type: web
    name: resource-vault-web
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://apisnoq.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
